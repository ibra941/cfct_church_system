<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFCT Church System</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --card: #ffffff;
        --primary: #0f5d89;
        --primary-dark: #0a3f5d;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef3f8 0%, #f9fbfd 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
        padding: 40px 32px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--primary);
        background: rgba(15, 93, 137, 0.12);
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.6rem, 3.5vw, 2.4rem);
        line-height: 1.2;
      }

      p {
        margin: 0 auto;
        max-width: 560px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 26px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        border-radius: 10px;
        padding: 11px 18px;
        font-weight: 600;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-secondary {
        background: #e8eff4;
        color: var(--primary-dark);
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(15, 93, 137, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Karibu CFCT</span>
      <h1>Tovuti ya CFCT Church System</h1>
      <p>
        Umefungua tovuti kikamilifu kutoka Admin. Sasa link ya "Tazama tovuti"
        inafanya kazi na haitarudisha kosa la 404 tena.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/admin/">Nenda Admin</a>
        <a class="btn btn-secondary" href="/api/">Angalia API</a>
      </div>
    </main>
  </body>
</html>
