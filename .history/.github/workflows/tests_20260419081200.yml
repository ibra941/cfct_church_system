name: Run Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      DB_NAME: cfct_db
      DB_USER: postgres
      DB_PASSWORD: testpass
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: github-actions-test-key
      DEBUG: "True"
      USE_SQLITE_FOR_TESTS: "True"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cfct_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpq-dev

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          cd backend
          python manage.py test --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build check
        run: |
          cd frontend
          npm run build
