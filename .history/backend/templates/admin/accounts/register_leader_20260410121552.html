{% extends "admin/base_site.html" %} {% load static %} {% block title %}{{ title
}}{% endblock %} {% block content %}
<div id="content-main">
  <div class="module">
    <h1>{{ title }}</h1>

    <form method="post" id="leader-registration-form">
      {% csrf_token %}

      <div class="form-row">
        <label for="id_role">Role:</label>
        <select name="role" id="id_role" required>
          <option value="">Select Role</option>
          <option value="zone_leader">Zone Leader</option>
          <option value="regional_leader">Regional Leader</option>
          <option value="district_leader">District Leader</option>
          <option value="local_leader">Local Leader (Church Leader)</option>
        </select>
      </div>

      <div class="form-row" id="zone-selection" style="display: none">
        <label for="id_zone">Zone:</label>
        <select name="zone" id="id_zone">
          <option value="">Select Zone</option>
          {% for zone in zones %}
          <option value="{{ zone.id }}">{{ zone.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row" id="region-selection" style="display: none">
        <label for="id_region">Region:</label>
        <select name="region" id="id_region">
          <option value="">Select Region</option>
        </select>
      </div>

      <div class="form-row" id="district-selection" style="display: none">
        <label for="id_district">District:</label>
        <select name="district" id="id_district">
          <option value="">Select District</option>
        </select>
      </div>

      <div class="form-row" id="church-selection" style="display: none">
        <label for="id_church">Church:</label>
        <select name="church_id" id="id_church">
          <option value="">Select Church</option>
        </select>
      </div>

      <div class="form-row">
        <label for="id_username">Username:</label>
        <input type="text" name="username" id="id_username" required />
      </div>

      <div class="form-row">
        <label for="id_email">Email:</label>
        <input type="email" name="email" id="id_email" required />
      </div>

      <div class="form-row">
        <label for="id_full_name">Full Name:</label>
        <input type="text" name="full_name" id="id_full_name" required />
      </div>

      <div class="form-row">
        <label for="id_phone">Phone:</label>
        <input type="text" name="phone" id="id_phone" required />
      </div>

      <div class="form-row">
        <label for="id_password">Password:</label>
        <input type="password" name="password" id="id_password" required />
      </div>

      <div class="submit-row">
        <input type="submit" value="Register Leader" class="default" />
        <a href="{% url 'admin:accounts_user_changelist' %}" class="button"
          >Cancel</a
        >
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const roleSelect = document.getElementById("id_role");
    const zoneSelection = document.getElementById("zone-selection");
    const regionSelection = document.getElementById("region-selection");
    const districtSelection = document.getElementById("district-selection");
    const churchSelection = document.getElementById("church-selection");

    const zoneSelect = document.getElementById("id_zone");
    const regionSelect = document.getElementById("id_region");
    const districtSelect = document.getElementById("id_district");
    const churchSelect = document.getElementById("id_church");

    roleSelect.addEventListener("change", function () {
      const role = this.value;
      zoneSelection.style.display = "none";
      regionSelection.style.display = "none";
      districtSelection.style.display = "none";
      churchSelection.style.display = "none";

      if (role === "zone_leader") {
        zoneSelection.style.display = "block";
      } else if (role === "regional_leader") {
        zoneSelection.style.display = "block";
        regionSelection.style.display = "block";
      } else if (role === "district_leader") {
        zoneSelection.style.display = "block";
        regionSelection.style.display = "block";
        districtSelection.style.display = "block";
      } else if (role === "local_leader") {
        zoneSelection.style.display = "block";
        regionSelection.style.display = "block";
        districtSelection.style.display = "block";
        churchSelection.style.display = "block";
      }
    });

    zoneSelect.addEventListener("change", function () {
      const zoneId = this.value;
      if (zoneId) {
        fetch(`/admin/accounts/api/regions/?zone_id=${zoneId}`)
          .then((response) => response.json())
          .then((data) => {
            regionSelect.innerHTML = '<option value="">Select Region</option>';
            data.forEach((region) => {
              regionSelect.innerHTML += `<option value="${region.id}">${region.name}</option>`;
            });
          });
      }
    });

    regionSelect.addEventListener("change", function () {
      const regionId = this.value;
      if (regionId) {
        fetch(`/admin/accounts/api/districts/?region_id=${regionId}`)
          .then((response) => response.json())
          .then((data) => {
            districtSelect.innerHTML =
              '<option value="">Select District</option>';
            data.forEach((district) => {
              districtSelect.innerHTML += `<option value="${district.id}">${district.name}</option>`;
            });
          });
      }
    });

    districtSelect.addEventListener("change", function () {
      const districtId = this.value;
      if (districtId) {
        fetch(`/admin/accounts/api/churches/?district_id=${districtId}`)
          .then((response) => response.json())
          .then((data) => {
            churchSelect.innerHTML = '<option value="">Select Church</option>';
            data.forEach((church) => {
              churchSelect.innerHTML += `<option value="${church.id}">${church.name}</option>`;
            });
          });
      }
    });
  });
</script>

<style>
  .form-row {
    margin-bottom: 15px;
  }

  .form-row label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .form-row input,
  .form-row select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .submit-row {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #eee;
  }

  .submit-row input,
  .submit-row a {
    margin-right: 10px;
  }
</style>
{% endblock %}
