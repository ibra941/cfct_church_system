version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=cfct_db
      - DB_USER=postgres
      - DB_PASSWORD=elias@83
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=cfct_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=elias@83
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: