services:
  - type: web
    name: cfct-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/live/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: cfct-backend.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://cfct-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cfct-backend.onrender.com,https://cfct-frontend.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://cfct-frontend.vercel.app
      - key: DB_NAME
        fromDatabase:
          name: cfct-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: cfct-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cfct-postgres
          property: password
      - key: DB_HOST
        fromDatabase:
          name: cfct-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cfct-postgres
          property: port

databases:
  - name: cfct-postgres
    databaseName: cfct_db
    user: cfct_user
