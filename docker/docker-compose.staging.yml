version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_staging_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - ../.env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_static_staging:/app/static
      - backend_media_staging:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend-builder:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_dist_staging:/frontend-dist
    command: sh -c "npm ci && npm run build && cp -r dist/* /frontend-dist/"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static_staging:/static
      - backend_media_staging:/media
      - frontend_dist_staging:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend-builder
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_staging_data:
  redis_staging_data:
  backend_static_staging:
  backend_media_staging:
  frontend_dist_staging:
